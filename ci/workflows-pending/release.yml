name: .github/workflows/ci.yml

# Publishes @quotagate/sdk to npm when a tag like v0.1.0 is pushed (DECISIONS D13).
# Requires the NPM_TOKEN repository secret: a granular, publish-only npm token.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: Publish @quotagate/sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/sdk version ${PKG_VERSION}"
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:dist --workspace @quotagate/sdk
      - name: Publish to npm
        run: |
          TAG=latest
          case "${GITHUB_REF_NAME}" in *-*) TAG=next ;; esac
          npm publish --workspace @quotagate/sdk --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
